# Render Blueprint: New > Blueprint > select this repository.
# Provide MONGODB_URI (e.g. a MongoDB Atlas connection string) when prompted; ADMIN_API_TOKEN is generated for you.
services:
  - type: web
    name: scholarpath-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: scholarpath-index
